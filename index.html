<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- защита: страница загружает скрипты, стили и медиа только со своего домена и из разрешённых источников -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; media-src 'self' blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>aketaminov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff00e6;            /* основной неоновый цвет */
    --accent-dim: #a1009a;
    --card: rgba(0, 0, 0, .08);   /* прозрачность карточек: 0 = полностью прозрачные */
    --radius: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    background: #000;
    color: var(--accent);
    font-family: "Outfit", system-ui, sans-serif;
    overflow-x: hidden;
  }

  /* ---------- фон и снег ---------- */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background: #000 url("https://i.pinimg.com/originals/f1/eb/a0/f1eba09749f72888d17f62c3ae0c7e7e.gif") center / cover no-repeat;
  }
  #bg::after { /* затемнение, чтобы текст читался: меняй .55 */
    content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.55);
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  /* ---------- экран входа ---------- */
  #enter {
    position: fixed; inset: 0; z-index: 50; background: #000;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity .6s ease, visibility .6s;
    font-size: 1.3rem; letter-spacing: .08em;
    text-shadow: 0 0 12px var(--accent);
  }
  #enter.hide { opacity: 0; visibility: hidden; }

  /* ---------- общий layout ---------- */
  main {
    position: relative; z-index: 1;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    padding: 24px 16px;
  }
  @media (min-width: 1000px) {
    main { padding-left: 330px; }
  }

  /* ---------- профиль ---------- */
  .card {
    width: min(800px, 100%);
    background: var(--card);
    border-radius: var(--radius);
    position: relative;
    padding: 44px 24px 28px;
    display: flex; flex-direction: column; align-items: center;
    transform-style: preserve-3d; transition: transform .15s ease-out;
  }
  .avatar {
    width: 148px; height: 148px; border-radius: 50%;
    object-fit: cover;
    background: radial-gradient(circle at 35% 30%, #555, #111);
    display: block;
  }
  .name {
    margin-top: 16px; font-size: 3rem; font-weight: 500;
    text-shadow: 0 0 10px var(--accent), 0 0 28px rgba(255,0,230,.55);
  }
  .location {
    margin-top: 22px; display: flex; align-items: center; gap: 6px;
    font-size: 1.05rem;
  }
  .location svg { width: 18px; height: 18px; fill: var(--accent); }

  .links { margin-top: 24px; display: flex; align-items: center; gap: 12px; }
  .links a {
    display: grid; place-items: center; transition: transform .2s;
    text-decoration: none; color: var(--accent); outline: none;
  }
  .links a:hover { transform: translateY(-3px) scale(1.08); }
  .links .tg svg, .links .discord svg {
    width: 48px; height: 48px; fill: var(--accent); filter: drop-shadow(0 0 8px var(--accent));
  }

  /* значок Discord: при наведении появляется подпись */
  .discord { position: relative; cursor: pointer; }
  .discord::before {
    content: "discord"; position: absolute; bottom: calc(100% + 10px); left: 50%;
    transform: translateX(-50%); white-space: nowrap;
    padding: 4px 12px; border-radius: 10px; font-size: .95rem; color: var(--accent);
    background: rgba(0,0,0,.6); text-shadow: 0 0 8px var(--accent);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .discord:hover::before { opacity: 1; }

  .views {
    position: absolute; left: 20px; bottom: 16px;
    display: flex; align-items: center; gap: 8px; font-size: 1.05rem;
  }
  .views svg { width: 22px; height: 22px; fill: var(--accent); }

  /* ---------- боковая панель: список треков + проигрыватель ---------- */
  #side {
    position: fixed; left: 24px; top: 120px; z-index: 2;
    width: 280px; display: flex; flex-direction: column; gap: 22px;
  }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .track {
    background: none; border: 0; cursor: pointer; text-align: left;
    font: inherit; font-size: 1.1rem; color: var(--accent-dim);
    padding: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .2s, transform .2s, text-shadow .2s;
  }
  .track:hover { color: var(--accent); transform: translateX(4px); }
  .track.active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

  .player { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 10px; color: var(--accent-dim); font-size: .95rem; }
  .bar {
    flex: 1; height: 4px; border-radius: 4px; background: rgba(255,0,230,.2);
    cursor: pointer; position: relative;
  }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); border-radius: 4px; }
  .ctrl { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .ctrl button {
    background: none; border: 0; cursor: pointer; display: grid; place-items: center;
    color: var(--accent-dim); transition: color .2s, transform .2s;
  }
  .ctrl button:hover { color: var(--accent); transform: scale(1.12); }
  .ctrl svg { fill: currentColor; width: 24px; height: 24px; }
  .ctrl .play { color: var(--accent); }
  .ctrl .play svg { width: 36px; height: 36px; }

  /* ---------- кнопка звука ---------- */
  #mute {
    position: fixed; top: 24px; right: 24px; z-index: 5;
    width: 72px; height: 72px; border-radius: 16px; border: 0; cursor: pointer;
    background: rgba(0,0,0,.08); display: grid; place-items: center;
  }
  #mute svg { width: 36px; height: 36px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- телефон: всё в один столбик ---------- */
  @media (max-width: 999px) {
    #side { position: static; width: 100%; max-width: 800px; margin: 0 auto 40px; padding: 0 16px; }
    main { padding-top: 60px; }
    #mute { top: 14px; right: 14px; width: 52px; height: 52px; }
    #mute svg { width: 26px; height: 26px; }
    .name { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<div id="enter">нажми, чтобы войти</div>
<div id="bg"></div>
<canvas id="snow"></canvas>

<button id="mute" aria-label="Звук">
  <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="wave1" d="M15.5 8.5a5 5 0 0 1 0 7"/><path id="wave2" d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
</button>

<!-- ===== ПРОФИЛЬ ===== -->
<main id="home">
  <section class="card" id="card">
    <img class="avatar" src="https://i.pinimg.com/originals/56/00/5a/56005a1acfe12d3df3e97c646d81b561.gif" alt="" referrerpolicy="no-referrer" onerror="this.removeAttribute('src')">
    <h1 class="name">aketaminov</h1>

    <div class="location">
      <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      hahahah
    </div>

    <div class="links">
      <a class="tg" href="https://t.me/aketaminov" target="_blank" rel="noopener" aria-label="Telegram">
        <svg viewBox="0 0 24 24"><path d="M21.7 3.3 2.6 10.7c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 5.8c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.7-.8l3.2-15.2c.3-1.3-.5-1.9-1.4-1.5zM8.5 13.2l9.8-6.2c.5-.3.9-.1.5.2l-8.1 7.3-.3 3.4-1.9-4.7z"/></svg>
      </a>
      <a class="discord" href="https://discord.com/users/1433753911600218134" target="_blank" rel="noopener" aria-label="Discord">
        <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.445.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.028C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056c2.053 1.508 4.041 2.423 5.993 3.029a.077.077 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.042-.106c-.652-.248-1.274-.55-1.872-.892a.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.1.246.198.373.292a.077.077 0 0 1-.007.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.029c1.961-.607 3.95-1.522 6.003-3.029a.077.077 0 0 0 .031-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      </a>
    </div>

    <div class="views">
      <svg viewBox="0 0 24 24"><path d="M12 5C6.5 5 2.3 8.6 1 12c1.3 3.4 5.5 7 11 7s9.7-3.6 11-7c-1.3-3.4-5.5-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
      <span id="viewCount">1</span>
    </div>
  </section>
</main>

<!-- ===== СЛЕВА: список треков и проигрыватель ===== -->
<aside id="side">
  <div class="list" id="list"></div>

  <div class="player">
    <div class="row">
      <span id="cur">0:00</span>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <span id="dur">0:00</span>
    </div>
    <div class="ctrl">
      <button id="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="play" class="play" aria-label="Пауза"><svg viewBox="0 0 24 24" id="playIcon"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
      <button id="next" aria-label="Дальше"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </div>
</aside>

<audio id="audio" preload="metadata"></audio>

<script>
/* ============ НАСТРОЙКИ ============ */
// Файлы track1.mp3, track2.mp3, track3.mp3 лежат рядом с index.html.
const TRACKS = [
  { title: "kageyoshi",                          src: "track1.mp3" },
  { title: "isntgood — Highway",                 src: "track2.mp3" },
  { title: "Casual affairs — One more (slowed)", src: "track3.mp3" },
];

/* ============ СНЕГ ============ */
(() => {
  const c = document.getElementById("snow"), ctx = c.getContext("2d");
  let w, h;
  function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
  addEventListener("resize", resize); resize();
  const flakes = Array.from({ length: 70 }, () => ({
    x: Math.random() * w, y: Math.random() * h,
    r: Math.random() * 5 + 1, v: Math.random() * .6 + .2,
    d: Math.random() * 1 - .5, a: Math.random() * .4 + .1
  }));
  (function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const f of flakes) {
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${f.a})`;
      ctx.shadowBlur = f.r * 2; ctx.shadowColor = "rgba(255,255,255,.5)";
      ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
      f.y += f.v; f.x += f.d * .5;
      if (f.y > h + 10) { f.y = -10; f.x = Math.random() * w; }
      if (f.x > w + 10) f.x = -10; if (f.x < -10) f.x = w + 10;
    }
    requestAnimationFrame(draw);
  })();
})();

/* ============ НАКЛОН КАРТОЧКИ ============ */
(() => {
  const card = document.getElementById("card");
  if (matchMedia("(pointer: coarse)").matches) return;
  addEventListener("mousemove", e => {
    const x = (e.clientX / innerWidth - .5) * 2, y = (e.clientY / innerHeight - .5) * 2;
    card.style.transform = `perspective(900px) rotateY(${x * 5}deg) rotateX(${-y * 5}deg)`;
  });
  addEventListener("mouseleave", () => card.style.transform = "");
})();

/* ============ СЧЁТЧИК ПРОСМОТРОВ ============ */
/* Работает только в этом браузере. Для настоящего счётчика нужен сервер. */
(() => {
  const START = 15700;
  let n = START;
  try { n = Math.max(+localStorage.getItem("views") || 0, START) + 1; localStorage.setItem("views", n); } catch {}
  // формат как в Telegram: 15701 -> "15.7K"
  const short = v => v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "K" : String(v);
  document.getElementById("viewCount").textContent = short(n);
})();

/* ============ ПЛЕЕР ============ */
(() => {
  const audio = document.getElementById("audio");
  const $ = id => document.getElementById(id);
  const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";
  const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  let i = 0;

  // список треков
  const list = $("list");
  TRACKS.forEach((t, idx) => {
    const b = document.createElement("button");
    b.className = "track";
    b.textContent = t.title;
    b.onclick = () => { load(idx); audio.play().catch(() => {}); };
    list.appendChild(b);
  });

  function markActive() {
    [...list.children].forEach((el, idx) => el.classList.toggle("active", idx === i));
  }

  function load(idx) {
    i = (idx + TRACKS.length) % TRACKS.length;
    audio.src = TRACKS[i].src;
    $("fill").style.width = "0";
    $("cur").textContent = "0:00";
    $("dur").textContent = "0:00";
    markActive();
  }
  const setIcon = () => $("playIcon").innerHTML = audio.paused ? PLAY : PAUSE;

  $("play").onclick = () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); };
  $("prev").onclick = () => { load(i - 1); audio.play().catch(() => {}); };
  $("next").onclick = () => { load(i + 1); audio.play().catch(() => {}); };
  audio.onplay = audio.onpause = setIcon;
  audio.onended = () => $("next").click();
  audio.onloadedmetadata = () => $("dur").textContent = fmt(audio.duration);
  audio.ontimeupdate = () => {
    $("cur").textContent = fmt(audio.currentTime);
    $("fill").style.width = (audio.currentTime / audio.duration * 100 || 0) + "%";
  };
  $("bar").onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    audio.currentTime = (e.clientX - r.left) / r.width * audio.duration || 0;
  };

  // звук вкл/выкл
  $("mute").onclick = () => {
    audio.muted = !audio.muted;
    $("wave1").style.display = $("wave2").style.display = audio.muted ? "none" : "";
  };

  // экран входа: клик даёт браузеру разрешение на звук и запускает трек
  $("enter").onclick = () => {
    $("enter").classList.add("hide");
    audio.volume = .6;
    audio.play().catch(() => {});
  };

  // при заходе стартует случайный трек
  load(Math.floor(Math.random() * TRACKS.length)); setIcon();
})();
</script>
</body>
</html>
